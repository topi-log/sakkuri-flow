<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>さっくりふろー</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <input id="title" maxlength="100" aria-label="フローのタイトル" />
      <div class="fileactions">
        <button id="import">
          <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v13m-5-5 5 5 5-5M4 15v6h16v-6" /></svg
          >インポート</button
        ><button id="export" class="primary">
          <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6" /></svg
          >エクスポート <span>⌄</span></button
        ><input type="file" id="file" accept="application/json,.json" hidden />
      </div>
    </header>
    <main>
      <div class="editor">
        <div class="toolbar">
          <div class="tools">
            <button id="select" class="active">↖ <span>選択</span></button
            ><button id="edit">✎ <span>編集</span></button>
            <div class="divider"></div>
            <button id="addlane">☷ <span>行を追加</span></button>
          </div>
          <div class="tools">
            <button id="global-properties">全体プロパティ</button>
            <div class="divider"></div>
            <button id="zoomout">−</button><span id="zoomlabel">100%</span
            ><button id="zoomin">＋</button>
          </div>
        </div>
        <div class="editorbody">
          <div class="stage">
            <div class="canvaswrap" id="canvaswrap">
              <div id="scroll-content">
                <div id="sticky-lanes">
                  <svg id="lanes-svg" xmlns="http://www.w3.org/2000/svg"></svg>
                </div>
                <div class="canvas" id="canvas">
                  <svg id="diagram" xmlns="http://www.w3.org/2000/svg"></svg>
                </div>
              </div>
            </div>
            <div
              id="lane-resize"
              role="separator"
              tabindex="0"
              aria-label="部署欄の幅を変更"
              aria-orientation="vertical"
            ></div>
          </div>
          <aside>
            <div class="asidehead">
              <span id="properties-title">プロパティ</span>
              <button id="close-properties" aria-label="プロパティを閉じる">
                ×
              </button>
            </div>
            <div id="properties"></div>
          </aside>
        </div>
        <footer><span id="stats"></span></footer>
      </div>
    </main>
    <div id="toast"></div>
    <dialog
      id="confirm-dialog"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-message"
    >
      <h2 id="confirm-title"></h2>
      <p id="confirm-message"></p>
      <div class="confirm-actions">
        <button id="confirm-cancel" type="button" autofocus>キャンセル</button
        ><button id="confirm-accept" type="button" class="primary"></button>
      </div>
    </dialog>
    <dialog id="setup-dialog" aria-labelledby="setup-title">
      <div class="setup-heading">
        <h2 id="setup-title">全体設定</h2>
        <button id="close-setup" aria-label="初期設定を閉じる" type="button">
          ×
        </button>
      </div>
      <div id="setup-content"></div>
      <div class="setup-footer">
        <button id="finish-setup" class="primary" type="button">
          編集を始める
        </button>
      </div>
    </dialog>
    <script src="app.js"></script>
    <script src="usability.js"></script>
  </body>
</html>
